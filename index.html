<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Auto Publisher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #444;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      display: none;
      margin-top: 25px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>TikTok Auto Publisher</h1>

    <p>
      Prepare and publish your TikTok content
      through authorized integrations.
    </p>

    <button onclick="getStarted()">
      Get Started
    </button>

    <div id="message">
      <strong>Get Started!</strong>
      <p>
        Your TikTok publishing setup can begin here.
      </p>
    </div>

  </div>

  <script>
    function getStarted() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
