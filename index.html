<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Publisher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 70px 20px 40px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      line-height: 1.15;
      margin: 0 0 25px;
    }

    .description {
      font-size: 20px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 35px;
    }

    button {
      padding: 16px 35px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #message {
      display: none;
      margin-top: 30px;
      padding: 25px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    #message h2 {
      margin-top: 0;
    }

    .footer {
      margin-top: 70px;
      padding-top: 25px;
      border-top: 1px solid #ddd;
      font-size: 15px;
    }

    .footer a {
      color: #111;
      text-decoration: underline;
      margin: 0 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Auto Publisher</h1>

    <p class="description">
      Prepare and publish your social media content
      through authorized integrations.
    </p>

    <button onclick="getStarted()">
      Get Started
    </button>

    <div id="message">
      <h2>Get Started!</h2>
      <p>
        Your publishing setup can begin here.
      </p>
    </div>

    <div class="footer">
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>

  </div>

  <script>
    function getStarted() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
